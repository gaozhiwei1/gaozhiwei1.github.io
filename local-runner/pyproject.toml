[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math2llm-runner"
version = "0.1.0"
description = "Loopback-only Python execution runner for Math2LLM coding exercises"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Math2LLM" }]
dependencies = []

[project.scripts]
math2llm-runner = "math2llm_runner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
math2llm_runner = ["problems.json"]
